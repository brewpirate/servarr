services:
  jellyfin-nvidia:
    extends:
      file: ../service.compose.yaml
      service: arr-service
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin_nvidia
    user: root
    environment:
      NVIDIA_VISIBLE_DEVICES: all 
      NVIDIA_DRIVER_CAPABILITIES: all
    #   - JELLYFIN_PublishedServerUrl=
    volumes:
      - ./config:/config
      - ${MEDIA_MOVIES_PATH}:/Films
      - ${MEDIA_SERIES_PATH}:/TVShows
      - ${MEDIA_BASE_PATH}:/media/arr
    # runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Or specify specific GPU UUIDs
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.entrypoints=web"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.servarr.local`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - homepage.group=Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - homepage.href=http://jellyfin.servarr.local/
      - homepage.description=Media solution that puts you in control of your media. Stream to any device from your own server, with no strings attached.
    restart: unless-stopped